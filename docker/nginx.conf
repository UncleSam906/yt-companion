server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css text/xml application/xml application/rss+xml application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Astro fingerprints everything in /_astro — cache it forever.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ~* \.(?:svg|png|jpe?g|webp|avif|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }
  location / {
    add_header Cache-Control "public, max-age=300, must-revalidate";
    try_files $uri $uri/ $uri.html =404;
  }
  error_page 404 /404.html;
}
