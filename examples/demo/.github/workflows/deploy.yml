# Builds the site on every push to main and publishes it to GitHub Pages.
# Enable: Settings → Pages → Source: "GitHub Actions".
name: Deploy site
on:
  push: { branches: [main] }
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # daily: picks up new uploads if you enable the sync step
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g github:UncleSam906/yt-companion
      # Optional: auto-import new uploads (requires channel.id in config.yaml).
      # To use the YouTube Data API, add YT_API_KEY under Settings -> Secrets and
      # variables -> Actions, and pass it to this step only:
      #   env: { YT_API_KEY: ${{ secrets.YT_API_KEY }} }
      # Never write the key into config.yaml or this file.
      # - run: yt-companion sync && git config user.name bot && git config user.email bot@users.noreply.github.com && git add content && git commit -m "sync videos" && git push || true
      - run: yt-companion build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
